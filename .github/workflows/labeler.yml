name: Labeler

# Label fork PRs without checking out or running their code.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-slim
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false

      - uses: actions/labeler@v7
